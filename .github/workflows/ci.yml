name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.changes.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test CI policy
        run: bash .github/scripts/ci_test.sh
      - name: Select site checks
        id: changes
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/ci.sh changes

  build:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Build site
        run: pnpm build

  ci-checks:
    name: CI / Required Checks
    if: ${{ always() }}
    needs: [changes, build]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .github/scripts/ci.sh verify
