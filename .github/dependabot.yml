version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Docusaurus 3.10.2 requires the 0.1.x layout adapter.
      - dependency-name: "@mermaid-js/layout-elk"
        versions:
          - ">=0.2.0"
      # Let the supply-chain release-age policy expire before reconsidering it.
      - dependency-name: lucide-react
        versions:
          - 1.27.0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
